[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/zooslab/zoos-upscale"

[workspace.dependencies]
async-trait = "=0.1.92"
atomic-write-file = "=0.3.1"
fs4 = "=1.1.0"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
crc32fast = "=1.5.1"
flate2 = "=1.1.9"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=0.8.22"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.25.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
